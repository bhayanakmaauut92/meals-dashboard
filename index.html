<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meals Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  header h1 { font-size: 20px; font-weight: 600; }
  header span { font-size: 13px; color: #888; }
  .day-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .day-tab { padding: 6px 14px; border-radius: 8px; border: 1px solid #e0e0d8; background: transparent; cursor: pointer; font-size: 12px; color: #666; transition: all .15s; }
  .day-tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; font-weight: 500; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .metric { background: #fff; border-radius: 10px; padding: 14px 16px; border: 1px solid #eee; }
  .metric-label { font-size: 11px; color: #999; margin-bottom: 4px; }
  .metric-val { font-size: 24px; font-weight: 600; }
  .bar-track { height: 5px; border-radius: 3px; background: #f0f0ec; margin-top: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }
  .metric-goal { font-size: 10px; color: #bbb; margin-top: 4px; }
  .meals-card { background: #fff; border-radius: 12px; border: 1px solid #eee; padding: 16px; margin-bottom: 20px; }
  .meals-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .meals-header p { font-size: 14px; font-weight: 600; }
  .meals-header span { font-size: 11px; color: #999; }
  .meal-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f5f5f0; }
  .meal-row:last-child { border-bottom: none; }
  .meal-info { flex: 1; min-width: 0; }
  .meal-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meal-macros { font-size: 11px; color: #999; margin-top: 2px; }
  .meal-type { font-size: 10px; padding: 2px 7px; border-radius: 6px; background: #f5f5f0; color: #666; white-space: nowrap; }
  .kcal-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 7px; background: #e8f5e9; color: #2e7d32; white-space: nowrap; }
  .empty { text-align: center; padding: 2rem 0; font-size: 13px; color: #bbb; }
  .chart-wrap { background: #fff; border-radius: 12px; border: 1px solid #eee; padding: 16px; }
  .chart-label { font-size: 11px; color: #bbb; text-align: center; margin-top: 8px; }
  .loading { text-align: center; padding: 4rem 0; font-size: 14px; color: #999; }
  .error { text-align: center; padding: 2rem; font-size: 13px; color: #e53e3e; background: #fff5f5; border-radius: 10px; }
  .refresh-btn { font-size: 12px; padding: 6px 14px; border-radius: 8px; border: 1px solid #e0e0d8; background: transparent; cursor: pointer; color: #666; }
  .refresh-btn:hover { background: #f5f5f0; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Food diary</h1>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="last-updated"></span>
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
    </div>
  </header>

  <div id="app"><div class="loading">Loading your meals...</div></div>
</div>

<script>
const API_BASE = 'https://n8n-99fg.onrender.com/webhook';
const GOALS = { kcal: 2000, prot: 120, carb: 250, fat: 65 };

let allMeals = {};
let activeDay = todayKey();
let weekChart = null;

function todayKey() {
  return new Date().toISOString().slice(0, 10);
}

function last7() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }
  return days;
}

function getDay(day) {
  const meals = allMeals[day] || [];
  return meals.reduce((a, m) => ({
    kcal: a.kcal + (m.kcal || 0),
    prot: a.prot + (m.prot || 0),
    carb: a.carb + (m.carb || 0),
    fat: a.fat + (m.fat || 0),
    meals
  }), { kcal: 0, prot: 0, carb: 0, fat: 0, meals: [] });
}

async function loadData() {
  try {
    const res = await fetch(`${API_BASE}/meals-read`);
    const data = await res.json();
    if (data.success) {
      allMeals = data.meals || {};
      document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
      render();
    } else {
      showError('Could not load meals data.');
    }
  } catch (e) {
    showError('Could not reach n8n. Is it running? ' + e.message);
  }
}

function showError(msg) {
  document.getElementById('app').innerHTML = `<div class="error">${msg}</div>`;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="day-tabs" id="day-tabs"></div>
    <div class="metrics" id="metrics"></div>
    <div class="meals-card">
      <div class="meals-header">
        <p>Meals</p>
        <span id="meal-count"></span>
      </div>
      <div id="meal-list"></div>
    </div>
    <div class="chart-wrap">
      <div style="position:relative;height:200px">
        <canvas id="weekChart" role="img" aria-label="7-day calorie chart">Weekly calories.</canvas>
      </div>
      <p class="chart-label">7-day calorie overview</p>
    </div>
  `;
  renderTabs();
  renderMetrics();
  renderMeals();
  renderChart();
}

function renderTabs() {
  const days = last7();
  const el = document.getElementById('day-tabs');
  el.innerHTML = '';
  days.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (d === activeDay ? ' active' : '');
    const dd = new Date(d + 'T12:00:00');
    btn.textContent = d === todayKey() ? 'Today' : dd.toLocaleDateString('en', { weekday: 'short', day: 'numeric' });
    btn.onclick = () => { activeDay = d; renderTabs(); renderMetrics(); renderMeals(); renderChart(); };
    el.appendChild(btn);
  });
}

function renderMetrics() {
  const { kcal, prot, carb, fat } = getDay(activeDay);
  document.getElementById('metrics').innerHTML = `
    <div class="metric">
      <div class="metric-label">Calories</div>
      <div class="metric-val" style="color:#e53e3e">${Math.round(kcal)}</div>
      <div class="bar-track"><div class="bar-fill" style="background:#e53e3e;width:${Math.min(100, Math.round(kcal / GOALS.kcal * 100))}%"></div></div>
      <div class="metric-goal">goal: ${GOALS.kcal} kcal</div>
    </div>
    <div class="metric">
      <div class="metric-label">Protein</div>
      <div class="metric-val" style="color:#3182ce">${Math.round(prot)}g</div>
      <div class="bar-track"><div class="bar-fill" style="background:#3182ce;width:${Math.min(100, Math.round(prot / GOALS.prot * 100))}%"></div></div>
      <div class="metric-goal">goal: ${GOALS.prot}g</div>
    </div>
    <div class="metric">
      <div class="metric-label">Carbs</div>
      <div class="metric-val" style="color:#d69e2e">${Math.round(carb)}g</div>
      <div class="bar-track"><div class="bar-fill" style="background:#d69e2e;width:${Math.min(100, Math.round(carb / GOALS.carb * 100))}%"></div></div>
      <div class="metric-goal">goal: ${GOALS.carb}g</div>
    </div>
    <div class="metric">
      <div class="metric-label">Fat</div>
      <div class="metric-val" style="color:#38a169">${Math.round(fat)}g</div>
      <div class="bar-track"><div class="bar-fill" style="background:#38a169;width:${Math.min(100, Math.round(fat / GOALS.fat * 100))}%"></div></div>
      <div class="metric-goal">goal: ${GOALS.fat}g</div>
    </div>
  `;
}

function renderMeals() {
  const { meals } = getDay(activeDay);
  document.getElementById('meal-count').textContent = meals.length + ' item' + (meals.length !== 1 ? 's' : '');
  const el = document.getElementById('meal-list');
  if (!meals.length) {
    el.innerHTML = '<div class="empty">No meals logged for this day</div>';
    return;
  }
  el.innerHTML = meals.map(m => `
    <div class="meal-row">
      <div class="meal-info">
        <div class="meal-name">${m.name}</div>
        <div class="meal-macros">${m.weight ? m.weight + 'g · ' : ''}P ${Math.round(m.prot)}g · C ${Math.round(m.carb)}g · F ${Math.round(m.fat)}g</div>
      </div>
      <span class="meal-type">${m.meal || 'other'}</span>
      <span class="kcal-badge">${Math.round(m.kcal)} kcal</span>
    </div>
  `).join('');
}

function renderChart() {
  const days = last7();
  const labels = days.map(d => new Date(d + 'T12:00:00').toLocaleDateString('en', { weekday: 'short' }));
  const data = days.map(d => Math.round(getDay(d).kcal));
  const colors = days.map(d => d === activeDay ? '#e53e3e' : '#bee3f8');
  if (weekChart) weekChart.destroy();
  weekChart = new Chart(document.getElementById('weekChart'), {
    type: 'bar',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 5 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.parsed.y + ' kcal' } } },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#aaa', font: { size: 11 } } },
        y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { color: '#aaa', font: { size: 10 } }, beginAtZero: true, suggestedMax: Math.max(GOALS.kcal, ...data) + 300 }
      }
    }
  });
}

loadData();
</script>
</body>
</html>
